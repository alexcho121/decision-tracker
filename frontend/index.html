<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Decision Tracker</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">DECISION TRACKER</p>
        <h1>Compare your options clearly.</h1>
      </div>
      <button id="newDecisionBtn" class="ghost-btn" type="button">New decision</button>
    </header>

    <main>
      <section id="createView" class="view active">
        <div class="panel hero-panel">
          <p class="step">Step 1</p>
          <h2>Create a decision</h2>
          <p class="muted">Write the question or choice you want to compare.</p>
          <form id="createDecisionForm" class="stack-form">
            <label for="decisionTitle">Decision title</label>
            <input id="decisionTitle" maxlength="500" placeholder="e.g. Which laptop should I buy?" required />
            <div class="actions"><button class="primary-btn" type="submit">Create</button></div>
          </form>
        </div>

        <div class="panel">
          <div class="section-heading">
            <div>
              <p class="step">Saved</p>
              <h2>Decision history</h2>
            </div>
            <button id="refreshHistoryBtn" class="text-btn" type="button">Refresh</button>
          </div>
          <div id="historyList" class="history-list"></div>
        </div>
      </section>

      <section id="detailView" class="view">
        <button id="backBtn" class="text-btn back-btn" type="button">← Back to history</button>
        <div class="panel">
          <p class="step">Decision</p>
          <div class="section-heading">
            <div>
              <h2 id="detailTitle"></h2>
              <p id="finalChoiceText" class="final-choice muted"></p>
            </div>
            <button id="deleteDecisionBtn" class="danger-btn" type="button">Delete decision</button>
          </div>
          <p class="muted">Add options, compare pros and cons, then choose your final option.</p>
          <form id="addOptionForm" class="inline-form">
            <input id="optionTitle" maxlength="255" placeholder="Add an option" required />
            <button class="primary-btn" type="submit">Add option</button>
          </form>
        </div>
        <div id="optionsGrid" class="options-grid"></div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
